# jobhunt configuration. Everything tunable lives here — no editing Python.
#
# Tune `filters` first. It is deterministic, free, and it is what keeps the
# LLM bill small: roughly 2000 raw postings -> 40 candidates before a single
# token is spent.
#
# Profile this is tuned for: AI/ML Engineer, ~4.4 years (05/2022 - present),
# GenAI / LLM apps, RAG, LangChain + LangGraph, MCP, multi-agent systems,
# AWS Bedrock, FastAPI, MLOps; earlier recommender / churn / streaming ML work.

filters:
  # Title regexes, matched case-insensitively against the job title only.
  # A title must match at least one include AND zero excludes.
  #
  # Gotcha: "sde" as a bare regex does NOT match "Software Development
  # Engineer" — different words entirely. Use \bsde\b for the acronym and
  # list the spelled-out variants separately, as below.
  include_titles:
    # --- core: AI / ML / GenAI / agent engineering ---------------------------
    # "AI Engineer", "ML Engineer", "Applied AI Engineer", "GenAI Developer",
    # "LLM Engineer", "NLP Engineer", "Agentic AI Engineer", "Agent Engineer",
    # "Forward Deployed AI Engineer", "Conversational AI Engineer"
    - '\b(ai|ml|llm|llms|genai|gen\s?ai|generative(\s+ai)?|nlp|agent|agents|agentic|machine learning|deep learning|rag|conversational(\s+ai)?|applied ai|applied ml)\b.*\b(engineer|developer)\b'
    # Reversed word order: "Software Engineer, AI", "Engineer - Machine Learning",
    # "Software Engineer, Agents", "Backend Engineer (LLM Platform)"
    - '\b(engineer|developer)\b.*\b(ai|ml|llm|llms|genai|gen\s?ai|generative|nlp|agent|agents|agentic|machine learning|deep learning|rag)\b'

    # --- MLOps / LLMOps / platform ------------------------------------------
    - '\b(mlops|llmops|aiops|genaiops)\b'
    - '\b(ml|ai|llm|machine learning)\s+(platform|infrastructure|infra)\b.*\bengineer\b'

    # --- retrieval / search / recommender / prompt ---------------------------
    - '\b(prompt|context|knowledge|retrieval|search|relevance|ranking|recommendation|recommender|personalization)\s+engineer\b'

    # --- customer-facing technical AI roles ---------------------------------
    - '\bforward[\s-]deployed\b.*\bengineer\b'

    # --- data science / applied science, only when AI/ML-flavoured ----------
    - '\b(data|applied)\s+scientist\b.*\b(ai|ml|llm|genai|generative|nlp|machine learning)\b'
    - '\b(ai|ml|llm|genai|generative|nlp|machine learning)\b.*\b(data|applied)\s+scientist\b'

    # --- Python backend (FastAPI / services) --------------------------------
    - '\b(python|fastapi)\b.*\b(engineer|developer)\b'
    - '\b(engineer|developer)\b.*\bpython\b'

    # --- generic titles used by AI startups ---------------------------------
    - 'member of technical staff'
    - '\bsde\b.*\b(ai|ml|llm|genai|generative|nlp|machine learning)\b'

    # Optional: uncomment to also pull plain, non-AI "Software Engineer" /
    # SDE postings. Off by default because it multiplies candidates (and LLM
    # screening cost) with roles that have nothing to do with your AI/ML work.
    # - 'software engineer'
    # - 'software development engineer'
    # - '\bsde\b'

  # Anything matching these is dropped even if an include matched.
  exclude_titles:
    - '\b(staff|principal|distinguished|fellow|architect)\b'      # too senior
    - '\blead\b'                                                  # lead = ~7+ yrs
    # NOTE: "senior" is intentionally NOT excluded any more. At ~4.4 years,
    # Senior AI/ML Engineer roles are a realistic stretch. If the screener
    # keeps rejecting them, add back:  - '\bsenior\b'
    - '\b(director|vp|vice president|head of|chief|cto)\b'
    - '\b(manager|management)\b'
    - '\b(intern|internship|apprentice|trainee)\b'                # too junior
    - '\b(sales|account executive|marketing|recruit|support|success)\b'
    - '\b(pre-?sales|developer advocate|devrel|developer relations|technical writer)\b'
    - '\b(frontend|front-end|ios|android|mobile|game|designer)\b' # wrong discipline
    - '\b(research scientist|machine learning scientist|ai scientist|postdoc)\b'  # research/PhD track

  # Substrings matched against "<location> <title>", case-insensitive.
  # Leave empty to accept every location.
  # Hybrid/on-site roles in these cities pass via the city names; "remote" is
  # handled by allow_remote below.
  locations:
    - hyderabad
    - bangalore
    - bengaluru
    - india

  # If true, anything reading as remote passes the location gate.
  allow_remote: true

  # Drop postings older than this. Set to null to disable.
  # Boards often re-stamp `updated_at`, so this is a soft signal, not a promise.
  max_age_days: 30

# --- LLM stages -------------------------------------------------------------
screen_batch_size: 8      # jobs per screening call. Higher = cheaper, sloppier.
screen_jd_chars: 1400     # JD truncation for screening
draft_jd_chars: 6000      # JD truncation for drafting
score_threshold: 7.0      # below this, no draft and no digest slot
max_per_digest: 5         # hard cap on expensive draft calls per run

# --- paths ------------------------------------------------------------------
companies_file: companies.yaml
profile_file: profile.json
seen_file: seen.json
digest_file: out/digest.html
tracker_csv: out/tracker.csv